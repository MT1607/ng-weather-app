<main
  class="width-screen mx-auto bg-cover bg-center relative"
  [style.backgroundImage]="'url(' + bgImageUrl + ')'"
>
  <div class="grid grid-cols-12 grid-rows-12 gap-2 h-fit xl:h-screen px-6 xl:px-24">
    <!-- Header -->
    <div class="col-span-12 col-start-1 flex justify-between items-center z-10">
      <img [src]="logoUrl" alt="logo-weather-web" class="w-22.5 h-11.75 object-contain mt-10" />

      <div
        class="relative border-b-2 md:w-[27%] xl:w-[30.7%] max-w-[55%] col-span-4 text-white/70 pb-1 flex items-center mt-10"
      >
        <input
          #searchInput
          id="searchInput"
          type="text"
          placeholder="Search Location..."
          class="bg-transparent placeholder-white/70 focus:outline-none pr-10 w-full"
          (keyup.enter)="onSearch(searchInput.value)"
        />
        <img
          [src]="searchIconUrl"
          alt="search-icon"
          class="w-6 h-6 absolute right-0 top-2.5 -translate-y-1/2 cursor-pointer"
          (click)="onSearch(searchInput.value)"
        />
      </div>
    </div>

    <!-- Info -->
    <section
      class="col-span-12 row-start-3 xl:row-start-10 xl:col-span-7 flex flex-col justify-between"
    >
      <app-weather-info></app-weather-info>
    </section>

    <!-- Detail -->
    <section
      class="col-span-12 row-span-12 xl:row-start-auto xl:col-span-4 xl:col-start-9 relative z-0"
    >
      <!-- Background mờ kéo ra ngoài padding sang phải -->
      <div
        class="hidden xl:block absolute inset-0 -top-32 -right-24 bg-white/10 backdrop-blur-md z-0"
      ></div>

      <!-- Content -->
      <div class="relative z-10 md:ml-10">
        <app-weather-detail></app-weather-detail>
      </div>
    </section>
  </div>
</main>

<router-outlet />
